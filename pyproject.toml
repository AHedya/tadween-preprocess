[project]
name = "tadween-preprocess"
version = "0.1.0"
description = "A resilient, serverless-ready, high-concurrency microservice for media preprocessing, FFmpeg compression, and storage orchestration."
readme = "README.md"
authors = [{ name = "Abdulrahman Hedya", email = "abdohedya19@gmail.com" }]
license = { file = "LICENSE" }
requires-python = "~=3.14.0"

# Base dependency: Pure schemas and validation for clients/monolith
dependencies = ["pydantic>=2.10.6"]

[project.optional-dependencies]
worker = [
    "aiofiles>=25.1.0",
    "httpx~=0.28.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "platformdirs~=4.9.0",
    "psutil>=7.2.2",
    "requests>=2.34.2",
    "resource-semaphore[utils]>=1.3.1",
    "typed-ffmpeg>=4.1",
]
runpod = ["runpod>=1.12.0"]
all = ["tadween-preprocess[runpod,worker]"]

[dependency-groups]
dev = [
    "nox>=2026.7.11",
    "pre-commit>=4.0.0",
    "pyrefly>=1.2.0",
    "ruff>=0.16.0",
    "types-aiofiles>=25.1.0.20260518",
    "types-boto3[s3]>=1.43.57",
    "types-psutil>=7.2.2.20260518",
    "types-requests>=2.33.0.20260712",
]
test = [
    "boto3>=1.43.36",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.7.0",
    "pytest-httpserver>=1.1.0",
]


[build-system]
requires = ["uv_build>=0.11.0,~=0.12.0"]
build-backend = "uv_build"

[tool.pyrefly]
preset = "default"
search-path = ["src", "."]

[tool.pytest]
asyncio_mode = "auto"
testpaths = ["tests/integration", "tests/unit"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
env = ["ENVIRONMENT=TEST"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (managed by ruff format)
]
